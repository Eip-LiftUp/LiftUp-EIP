services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: liftup-postgres_db
    environment:
      POSTGRES_DB: liftup_db
      POSTGRES_USER: liftup_user
      POSTGRES_PASSWORD: liftup_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftup_user -d liftup_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - liftup-network
    restart: unless-stopped

  # ============================================================================
  # Database Web UI (Adminer)
  # ============================================================================
  adminer:
    image: adminer:4
    container_name: liftup-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - liftup-network
    restart: unless-stopped

  # ============================================================================
  # Backend API (Rust/Axum)
  # ============================================================================
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: liftup-backend
    environment:
      DATABASE_URL: postgres://liftup_user:liftup_password@postgres:5432/liftup_db
      DATABASE_MAX_CONNECTIONS: 10
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: liftup_backend=debug,tower_http=debug
      # Required: no default value. `docker compose` stops with this message if it is unset.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 characters, see .env.example)}
      JWT_EXPIRATION_DAYS: ${JWT_EXPIRATION_DAYS:-7}
      # Browser origins allowed by CORS (the Flutter web build is served on port 8090).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      # The ai-service below is disabled, so the URL must be provided (see .env.example).
      # If you enable it, use http://ai-service:8000 (service name, container port).
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8000}
      AI_TIMEOUT_SECS: ${AI_TIMEOUT_SECS:-5}
      AI_ANALYSIS_TIMEOUT_SECS: ${AI_ANALYSIS_TIMEOUT_SECS:-120}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    # Lets `host.docker.internal` resolve to the host on Linux too (built in on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - liftup-network
    restart: unless-stopped

  # ============================================================================
  # AI/ML Service (Python/FastAPI) - I3D Video Analysis - DESACTIVE
  # ============================================================================
