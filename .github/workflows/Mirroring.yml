name: Mirroring_to_Epitech

env:
  MIRRORING_REPO: git@github.com:EpitechPGE3-2025/G-EIP-600-NCE-6-1-eip-6.git

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  merge_dev_to_main:
    name: Merge dev to main
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Merge dev into main
        run: |
          git checkout main
          git merge origin/dev --no-ff -m "Auto-merge dev into main"

  push_to_mirror:
      runs-on: ubuntu-latest
      if: |
        startsWith(github.ref, 'refs/heads/ga-ignore-') == false &&
        github.repository != 'EpitechPGE3-2025/G-EIP-600-NCE-6-1-eip-6'
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - uses: pixta-dev/repository-mirroring-action@v1
          with:
            target_repo_url:
              ${{ env.MIRRORING_REPO }}
            ssh_private_key:
              ${{ secrets.GIT_SSH_PRIVATE_KEY }}
