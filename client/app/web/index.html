<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LiftUp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LiftUp</title>
  <link rel="manifest" href="manifest.json">
  <!-- Shown until Flutter paints its first frame on top of it (debug builds
       take a while to load), instead of a blank white page. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0B1020; }
    #liftup-loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      color: #B7C0D9; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #liftup-loading .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid #22325E; border-top-color: #2FB6FF;
      animation: liftup-spin 0.8s linear infinite;
    }
    @keyframes liftup-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #liftup-loading .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <div id="liftup-loading" aria-hidden="true"><div class="spinner"></div>Chargement de LiftUp…</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
